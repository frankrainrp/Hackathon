name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web tests, types and build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        working-directory: my-app
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.18.0'
          package-manager-cache: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          package_json_file: my-app/package.json
          run_install: false
          cache: true
          cache_dependency_path: my-app/pnpm-lock.yaml
      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile
      - name: Node regression tests
        run: node --test apps/web/tests/*.test.mjs
      - name: Interface copy and live-parameter audit
        run: node ../tools/audit-interface-copy.cjs
      - name: TypeScript check
        run: pnpm --filter @smart-hub/web exec tsc --noEmit
      - name: Production build
        run: pnpm --filter @smart-hub/web build
      - name: Production HTTP integration (synthetic records)
        run: node apps/web/tests/lms-settings.integration.mjs

      - name: AI HTTP integration (local mocks, both languages)
        run: node apps/web/tests/ai-http.integration.mjs

  python:
    name: Python tests (Windows)
    runs-on: windows-2022
    timeout-minutes: 10
    defaults:
      run:
        working-directory: my-app/ops/lms-sync
    env:
      PYTHONUTF8: '1'
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11.9'
          cache: pip
          cache-dependency-path: |
            my-app/ops/lms-sync/requirements.txt
            my-app/ops/lms-sync/requirements-ci.txt
      - name: Install pinned dependencies
        run: python -m pip install --requirement requirements.txt --constraint requirements-ci.txt
      - name: Python regression tests
        run: python -m unittest discover -v
